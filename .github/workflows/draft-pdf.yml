# Gera o PDF de rascunho do artigo para o JOSE com a action oficial das Open Journals.
# Roda só quando paper/ (ou este arquivo) muda; o PDF fica disponível como artefato da execução.
name: Draft PDF
on:
  push:
    paths:
      - paper/**
      - .github/workflows/draft-pdf.yml
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper Draft
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@master
        with:
          journal: jose
          paper-path: paper/paper.md
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: paper
          path: paper/paper.pdf
          archive: false
